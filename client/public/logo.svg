<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Shield / Pin Base -->
  <defs>
    <linearGradient id="finditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101D36" />
      <stop offset="100%" stop-color="#1A2B4C" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62D8C3" />
      <stop offset="100%" stop-color="#4ecbb4" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="100" height="100" rx="24" fill="url(#finditGrad)" />
  
  <!-- Subtle Glow Effect -->
  <circle cx="50" cy="50" r="34" fill="#62D8C3" opacity="0.12" />
  
  <!-- Location Pin Outline -->
  <path d="M50 20C38.9543 20 30 28.9543 30 40C30 54 50 78 50 78C50 78 70 54 70 40C70 28.9543 61.0457 20 50 20Z" fill="url(#tealGrad)" />
  
  <!-- Magnifying Glass Center in Deep Navy -->
  <circle cx="50" cy="38" r="10" fill="#101D36" />
  <circle cx="50" cy="38" r="6" fill="#62D8C3" opacity="0.8" />
  
  <!-- Search Sparkle / Cross -->
  <path d="M56 44L63 51" stroke="#101D36" stroke-width="3" stroke-linecap="round" />
</svg>
